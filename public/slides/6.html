<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<title>아키텍처의 이해 — Web · WAS · DB란?</title>
<script src="https://picture-search.skywork.ai/aippt/static/tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.2.0/css/all.min.css">
<link rel="stylesheet" href="/report-midclevel/slides/shared/slide-fonts.css">
<link rel="stylesheet" href="/report-midclevel/slides/shared/slide-motion.css">
<style>
:root{--ppt-font:"Noto Sans KR",sans-serif;--ppt-bg:#0A0E1A;--ppt-bg-soft:#141B2D;--ppt-surface:#1E2638;--ppt-border:#334155;--ppt-text-1:#FFF;--ppt-text-2:#94A3B8;--ppt-text-3:#64748B;--ppt-accent:#00F0FF;--ppt-accent-2:#FACC15}
*{box-sizing:border-box;margin:0;padding:0}
body{width:100vw;height:100vh;overflow:hidden;background:var(--ppt-bg);display:flex;justify-content:center;align-items:center;font-family:var(--ppt-font)}
.slide{width:960px;height:720px;background:var(--ppt-bg);color:var(--ppt-text-1);display:flex;flex-direction:column;overflow:hidden;position:relative}
.slide::before{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 12% 20%,rgba(0,240,255,.06) 0%,transparent 50%)}
.title-r{flex-shrink:0;padding:24px 40px 8px;position:relative;z-index:1;display:flex;flex-direction:column;gap:6px}
.title-row{display:flex;align-items:center;gap:10px}
.bar{width:4px;height:32px;background:var(--ppt-accent);border-radius:2px}
.badge{font-size:13px;font-weight:700;padding:3px 10px;border-radius:12px;background:rgba(0,240,255,.1);border:1px solid rgba(0,240,255,.3);color:var(--ppt-accent)}
h1{font-size:28px;font-weight:700;margin:0}
.title-sub{font-size:15px;color:var(--ppt-text-2);padding-left:14px;line-height:1.45}
.line{height:1px;margin-top:6px;background:linear-gradient(90deg,var(--ppt-accent),transparent);opacity:.35}
.body{flex:1;min-height:0;padding:16px 40px 12px;display:flex;flex-direction:column;justify-content:center;gap:20px;position:relative;z-index:1}
.hero-msg{text-align:center;font-size:20px;font-weight:700;color:var(--ppt-text-1);line-height:1.45;max-width:720px;margin:0 auto}
.hero-msg em{font-style:normal;color:var(--ppt-accent-2)}
.preview{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.prev-card{background:var(--ppt-bg-soft);border:1px solid var(--ppt-border);border-radius:14px;padding:18px 14px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.prev-card i{font-size:32px;color:var(--ppt-accent)}
.prev-title{font-size:16px;font-weight:700}
.prev-sub{font-size:13px;color:var(--ppt-text-3);line-height:1.4}
.insight{flex-shrink:0;margin:0 40px 14px;padding:10px 16px;background:linear-gradient(90deg,rgba(250,204,21,.08),transparent);border-left:3px solid var(--ppt-accent-2);border-radius:0 8px 8px 0;font-size:14px;color:var(--ppt-text-2);line-height:1.45;position:relative;z-index:1}
.insight strong{color:var(--ppt-accent-2)}
html{overflow:hidden;margin:0;padding:0}
</style>
</head>
<body>
<div class="slide" data-motion="cards" data-motion-tier="medium">
  <div class="title-r">
    <div class="title-row"><div class="bar"></div><span class="badge">아키텍처 기초</span><h1>아키텍처의 이해</h1></div>
    <div class="title-sub">Web, WAS, DB의 역할과 차세대 구조가 왜 필요한가?</div>
    <div class="line"></div>
  </div>
  <div class="body">
    <div class="hero-msg">IT 시스템은 크게 <em>화면 · 업무 · 데이터</em> 세 층으로 나뉩니다.<br/>이후 설계·진행 내용을 이해하는 기준이 됩니다.</div>
    <div class="preview">
      <div class="prev-card"><i class="fas fa-desktop"></i><div class="prev-title">Web (화면)</div><div class="prev-sub">사용자가 보는 창구</div></div>
      <div class="prev-card"><i class="fas fa-gears"></i><div class="prev-title">WAS (업무)</div><div class="prev-sub">비즈니스를 처리하는 두뇌</div></div>
      <div class="prev-card"><i class="fas fa-database"></i><div class="prev-title">DB (데이터)</div><div class="prev-sub">정보를 보관하는 창고</div></div>
    </div>
  </div>
  <div class="insight"><strong>경영 시사점:</strong> 기술 용어보다 역할 이해가 먼저 — 이후 FaSS 설계·전환 논의의 공통 언어</div>
</div>
<script>
(function(){function s(){var e=document.querySelector('body>div');if(!e)return;var w=window.innerWidth,h=window.innerHeight,sc=Math.min(w/960,h/720);e.style.transform='scale('+sc+')';e.style.transformOrigin='top left';e.style.position='absolute';e.style.left=Math.round((w-960*sc)/2)+'px';e.style.top=Math.round((h-720*sc)/2)+'px';}s();window.addEventListener('resize',s);})();
</script>
</body>
</html>
