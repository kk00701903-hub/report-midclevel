<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<title>글로벌 디지털 4대 축</title>
<script src="https://picture-search.skywork.ai/aippt/static/tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.2.0/css/all.min.css">
<link rel="stylesheet" href="/report-midclevel/slides/shared/slide-fonts.css">
<link rel="stylesheet" href="/report-midclevel/slides/shared/slide-motion.css">
<link rel="stylesheet" href="/report-midclevel/slides/shared/slide-theme-fluent-dark.css">
<style>

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  width:100vw; height:100vh; overflow:hidden; background:var(--ppt-bg);
  display:flex; justify-content:center; align-items:center;
  font-family:var(--ppt-font-body);
}
.slide-root {
  width:960px; height:720px; background:var(--ppt-bg); color:var(--ppt-text-1);
  display:flex; flex-direction:column; overflow:hidden; position:relative;
}
.slide-root::before {
  content:''; position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(ellipse at 8% 12%, rgba(0, 120, 212,0.05) 0%, transparent 50%),
             radial-gradient(ellipse at 92% 88%, rgba(255, 185, 0,0.04) 0%, transparent 50%);
}
.title-region { flex-shrink:0; padding:22px 40px 8px; display:flex; flex-direction:column; gap:6px; }
.title-header { display:flex; align-items:center; gap:12px; }
.title-bar { width:4px; height:32px; background:var(--ppt-accent); border-radius:2px; flex-shrink:0; }
.title-badge {
  background:rgba(255, 185, 0,0.12); color:var(--ppt-accent-2);
  padding:3px 12px; border-radius:4px; font-size:13px; font-weight:600;
  border:1px solid rgba(255, 185, 0,0.3); white-space:nowrap;
}
.title-main {
  font-family:var(--ppt-font-display); font-size:28px; font-weight:700; line-height:1.22; margin:0;
}
.title-sub { font-size:15px; color:var(--ppt-text-2); padding-left:16px; line-height:1.4; }
.title-line {
  height:1px; width:100%;
  background:linear-gradient(90deg,var(--ppt-accent) 0%,transparent 100%);
  opacity:0.3; margin-top:4px;
}
.trend-grid {
  flex:1; min-height:0; padding:8px 32px 6px;
  display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; gap:12px;
  position:relative;
}
.hub-svg { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:80px; height:80px; pointer-events:none; z-index:0; opacity:.35; }
.trend-card {
  background:var(--ppt-bg-soft); border:1px solid var(--ppt-border);
  border-radius:var(--ppt-radius-lg); padding:16px 14px;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:10px; position:relative; overflow:hidden; text-align:center; z-index:1;
}
.watermark { position:absolute; bottom:-10px; right:-10px; font-size:80px; opacity:.06; pointer-events:none; }
.trend-card.cyan .watermark { color:var(--ppt-accent-light); }
.trend-card.green .watermark { color:var(--ppt-good); }
.trend-card.purple .watermark { color:var(--ppt-purple); }
.trend-card.gold .watermark { color:var(--ppt-accent-2); }
.accent-bar { position:absolute; bottom:0; left:0; right:0; height:3px; }
.trend-card.cyan .accent-bar { background:var(--ppt-accent); }
.trend-card.green .accent-bar { background:var(--ppt-good); }
.trend-card.purple .accent-bar { background:var(--ppt-purple); }
.trend-card.gold .accent-bar { background:var(--ppt-accent-2); }
.trend-card::before {
  content:''; position:absolute; top:0; left:0; right:0; height:3px;
}
.trend-card.cyan::before   { background:var(--ppt-accent); }
.trend-card.green::before  { background:var(--ppt-good); }
.trend-card.purple::before { background:var(--ppt-purple); }
.trend-card.gold::before   { background:var(--ppt-accent-2); }
.card-icon {
  width:60px; height:60px; border-radius:var(--ppt-radius-lg);
  display:flex; align-items:center; justify-content:center; font-size:28px; flex-shrink:0;
}
.card-icon.cyan   { background:rgba(0, 120, 212,0.12); color:var(--ppt-accent-light); }
.card-icon.green  { background:rgba(16,124,16,0.12); color:var(--ppt-good); }
.card-icon.purple { background:rgba(135,100,184,0.12); color:var(--ppt-purple); }
.card-icon.gold   { background:rgba(255, 185, 0,0.12); color:var(--ppt-accent-2); }
.card-title { font-size:20px; font-weight:700; line-height:1.28; }
.card-msg { font-size:15px; font-weight:600; color:var(--ppt-text-1); line-height:1.4; }
.card-detail { font-size:13px; color:var(--ppt-text-3); line-height:1.45; max-width:280px; }
.bottom-bar {
  flex-shrink:0; margin:0 32px 14px;
  padding:10px 16px; border-radius:var(--ppt-radius-md);
  background:linear-gradient(90deg,rgba(251,146,60,0.1),rgba(0, 120, 212,0.06),transparent);
  border:1px solid rgba(251,146,60,0.25);
  display:flex; align-items:center; gap:12px;
}
.bottom-bar i { color:var(--ppt-orange); font-size:18px; flex-shrink:0; }
.bottom-bar p { font-size:15px; color:var(--ppt-text-2); line-height:1.38; }
.bottom-bar strong { color:var(--ppt-orange); }
html { overflow:hidden; margin:0; padding:0; }
</style>
</head>
<body>
<div class="slide-root" data-motion="cards" data-motion-tier="medium">
  <div class="title-region">
    <div class="title-header">
      <div class="title-bar"></div>
      <span class="title-badge">FUTURE VISION</span>
      <h1 class="title-main">글로벌 디지털 4대 축</h1>
    </div>
    <div class="title-sub">글로벌 선도 기업이 동시에 투자하는 4대 디지털 전략</div>
    <div class="title-line"></div>
  </div>

  <div class="trend-grid">
    <svg class="hub-svg" viewBox="0 0 80 80"><circle cx="40" cy="40" r="8" fill="none" stroke="var(--ppt-accent)" stroke-width="1.5"/><line x1="40" y1="8" x2="40" y2="32" stroke="var(--ppt-accent)" stroke-width="1" opacity=".5"/><line x1="40" y1="48" x2="40" y2="72" stroke="var(--ppt-accent)" stroke-width="1" opacity=".5"/><line x1="8" y1="40" x2="32" y2="40" stroke="var(--ppt-accent)" stroke-width="1" opacity=".5"/><line x1="48" y1="40" x2="72" y2="40" stroke="var(--ppt-accent)" stroke-width="1" opacity=".5"/></svg>
    <div class="trend-card cyan">
      <i class="fas fa-cubes watermark"></i>
      <div class="card-icon cyan"><i class="fas fa-cubes"></i></div>
      <div class="card-title">모듈형 구조</div>
      <div class="card-msg">빠른 기능 출시</div>
      <div class="card-detail">독립 배포로 시장 변화에 즉각 대응</div>
      <div class="accent-bar"></div>
    </div>

    <div class="trend-card green">
      <i class="fas fa-cloud watermark"></i>
      <div class="card-icon green"><i class="fas fa-cloud"></i></div>
      <div class="card-title">클라우드</div>
      <div class="card-msg">비용·운영 효율</div>
      <div class="card-detail">사용량 기반 확장으로 IT 투자 최적화</div>
      <div class="accent-bar"></div>
    </div>

    <div class="trend-card purple">
      <i class="fab fa-github watermark"></i>
      <div class="card-icon purple"><i class="fab fa-github"></i></div>
      <div class="card-title">오픈소스</div>
      <div class="card-msg">벤더 종속 탈피</div>
      <div class="card-detail">표준 기술 채택으로 장기 비용·유연성 확보</div>
      <div class="accent-bar"></div>
    </div>

    <div class="trend-card gold">
      <i class="fas fa-robot watermark"></i>
      <div class="card-icon gold"><i class="fas fa-robot"></i></div>
      <div class="card-title">AI</div>
      <div class="card-msg">개발·운영 자동화</div>
      <div class="card-detail">반복 업무 자동화로 생산성·품질 동시 향상</div>
      <div class="accent-bar"></div>
    </div>
  </div>

  <div class="bottom-bar">
    <i class="fas fa-bullseye"></i>
    <p><strong>시사점:</strong> 4축 동시 투자는 글로벌 선도 기업의 표준 패러다임 — 물류·유통 분야에서도 경쟁력의 핵심 축입니다.</p>
  </div>
</div>
<script>
(function(){
  function applyScale(){
    var el=document.querySelector('body>div'); if(!el)return;
    var sw=window.innerWidth,sh=window.innerHeight;
    var scale=Math.min(sw/960,sh/720);
    el.style.transform='scale('+scale+')'; el.style.transformOrigin='top left';
    el.style.position='absolute';
    el.style.left=Math.round((sw-960*scale)/2)+'px';
    el.style.top=Math.round((sh-720*scale)/2)+'px';
  }
  applyScale(); window.addEventListener('resize',applyScale);
})();
</script>
</body>
</html>
