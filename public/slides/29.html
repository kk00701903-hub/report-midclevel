<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<title>비즈니스 혁신5 — 무결점 품질 통제</title>
<script src="https://picture-search.skywork.ai/aippt/static/tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.2.0/css/all.min.css">
<link rel="stylesheet" href="/report-midclevel/slides/shared/slide-fonts.css">
<link rel="stylesheet" href="/report-midclevel/slides/shared/slide-motion.css">
<link rel="stylesheet" href="/report-midclevel/slides/shared/slide-theme-fluent-dark.css">
<style>

*{box-sizing:border-box;margin:0;padding:0}
body{width:100vw;height:100vh;overflow:hidden;background:var(--ppt-bg);display:flex;justify-content:center;align-items:center;font-family:var(--ppt-font)}
.slide{width:960px;height:720px;background:var(--ppt-bg);color:var(--ppt-text-1);display:flex;flex-direction:column;overflow:hidden;position:relative}
.slide::before{content:'';position:absolute;inset:0;pointer-events:none;background:
  radial-gradient(ellipse at 50% 40%,rgba(0, 120, 212,.05) 0%,transparent 55%)}
.title-r{flex-shrink:0;padding:20px 36px 4px;position:relative;z-index:1;display:flex;flex-direction:column;gap:6px}
.title-row{display:flex;align-items:center;gap:10px}
.bar{width:4px;height:30px;background:var(--ppt-accent);border-radius:2px}
.badge{font-size:13px;font-weight:700;padding:3px 10px;border-radius:var(--ppt-radius-lg);background:rgba(255, 185, 0,.12);border:1px solid rgba(255, 185, 0,.35);color:var(--ppt-accent-2)}
h1.title-main{font-size:26px;font-weight:700;margin:0}
.title-sub{font-size:14px;color:var(--ppt-text-2);padding-left:14px;line-height:1.4}
.line{height:1px;margin-top:4px;background:linear-gradient(90deg,var(--ppt-accent),transparent);opacity:.35}
.body{flex:1;min-height:0;padding:10px 40px 8px;display:flex;flex-direction:column;gap:12px;justify-content:center;position:relative;z-index:1}
.metrics-wrap{position:relative}
.metrics-watermark{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:0}
.metrics-watermark i{font-size:200px;color:var(--ppt-accent-light);opacity:.04}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;position:relative;z-index:1}
.metric{background:var(--ppt-bg-soft);border:1px solid var(--ppt-border);border-radius:var(--ppt-radius-lg);
  padding:16px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.gauge-wrap{position:relative;width:90px;height:50px;margin-bottom:2px}
.gauge-wrap svg{width:90px;height:50px}
.gauge-num{position:absolute;bottom:0;left:50%;transform:translateX(-50%);font-size:28px;font-weight:800;line-height:1}
.metric .gauge-num{color:var(--ppt-accent-2)}
.metric.safe .gauge-num{color:var(--ppt-good)}
.metric-label{font-size:15px;font-weight:700;color:var(--ppt-text-1)}
.metric-sub{font-size:12px;color:var(--ppt-text-3);line-height:1.35}
.pipeline{display:flex;align-items:center;justify-content:center;gap:0;position:relative}
.pipeline::before{content:'';position:absolute;top:50%;left:10%;right:10%;height:4px;transform:translateY(-50%);
  background:linear-gradient(90deg,var(--ppt-accent-2),var(--ppt-accent),var(--ppt-bad));border-radius:2px;z-index:0;opacity:.4}
.step{flex:1;max-width:180px;background:var(--ppt-surface);border:1px solid var(--ppt-border);border-radius:var(--ppt-radius-lg);
  padding:12px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:5px;position:relative;z-index:1}
.step.s1{border-top:3px solid var(--ppt-accent-2)}
.step.s2{border-top:3px solid var(--ppt-accent)}
.step.s3{border-top:3px solid var(--ppt-bad)}
.step i{font-size:26px;color:var(--ppt-accent)}
.step-title{font-size:13px;font-weight:700}
.step-desc{font-size:11.5px;color:var(--ppt-text-3);line-height:1.35}
.pipe-arrow{font-size:18px;color:var(--ppt-text-2);z-index:1;padding:0 4px}
.policy-strip{display:flex;gap:10px}
.policy-item{flex:1;background:var(--ppt-bg-soft);border:1px solid var(--ppt-border);border-radius:10px;
  padding:10px;text-align:center;font-size:12px;font-weight:600;color:var(--ppt-text-2);line-height:1.35}
.policy-item i{display:block;font-size:18px;color:var(--ppt-accent-light);margin-bottom:5px}
.footer{margin:0 40px 12px;padding:9px 16px;border-left:3px solid var(--ppt-accent-2);
  background:rgba(255, 185, 0,.05);border-radius:0 8px 8px 0;font-size:14px;color:var(--ppt-text-2);line-height:1.45;position:relative;z-index:1}
.footer strong{color:var(--ppt-accent-2)}
html{overflow:hidden;margin:0;padding:0}
</style>
</head>
<body>
<div class="slide" data-motion="innovation" data-motion-tier="medium">
  <div class="title-r">
    <div class="title-row">
      <div class="bar"></div>
      <span class="badge">BUSINESS INNOVATION</span>
      <h1 class="title-main">비즈니스 혁신5 — 무결점 품질 통제</h1>
    </div>
    <div class="title-sub">배포 전 자동 품질 검사로 무결점 운영 환경 구축</div>
    <div class="line"></div>
  </div>
  <div class="body">
    <div class="metrics-wrap">
      <div class="metrics-watermark"><i class="fas fa-shield-halved"></i></div>
      <div class="metrics">
        <div class="metric">
          <div class="gauge-wrap">
            <svg viewBox="0 0 90 50"><path d="M5 45 A40 40 0 0 1 85 45" fill="none" stroke="var(--ppt-border)" stroke-width="6" stroke-linecap="round"/><path d="M5 45 A40 40 0 0 1 85 45" fill="none" stroke="#EF4444" stroke-width="6" stroke-linecap="round" stroke-dasharray="0 126"/></svg>
            <div class="gauge-num">0</div>
          </div>
          <div class="metric-label">치명적 결함</div>
          <div class="metric-sub">기준 미달 시 배포 자동 차단</div>
        </div>
        <div class="metric safe">
          <div class="gauge-wrap">
            <svg viewBox="0 0 90 50"><path d="M5 45 A40 40 0 0 1 85 45" fill="none" stroke="var(--ppt-border)" stroke-width="6" stroke-linecap="round"/><path d="M5 45 A40 40 0 0 1 85 45" fill="none" stroke="var(--ppt-good)" stroke-width="6" stroke-linecap="round" stroke-dasharray="101 126"/></svg>
            <div class="gauge-num">80%</div>
          </div>
          <div class="metric-label">테스트 커버리지</div>
          <div class="metric-sub">핵심 로직 테스트 의무화</div>
        </div>
        <div class="metric">
          <div class="gauge-wrap">
            <svg viewBox="0 0 90 50"><path d="M5 45 A40 40 0 0 1 85 45" fill="none" stroke="var(--ppt-border)" stroke-width="6" stroke-linecap="round"/><path d="M5 45 A40 40 0 0 1 85 45" fill="none" stroke="#EF4444" stroke-width="6" stroke-linecap="round" stroke-dasharray="0 126"/></svg>
            <div class="gauge-num">0</div>
          </div>
          <div class="metric-label">보안 취약점</div>
          <div class="metric-sub">보안 이슈 Zero Tolerance</div>
        </div>
      </div>
    </div>
    <div class="pipeline">
      <div class="step s1"><i class="fas fa-code"></i><div class="step-title">개발</div><div class="step-desc">변경 사항 등록</div></div>
      <span class="pipe-arrow"><i class="fas fa-chevron-right"></i></span>
      <div class="step s2"><i class="fas fa-magnifying-glass"></i><div class="step-title">자동 검사</div><div class="step-desc">품질·보안 기준 검증</div></div>
      <span class="pipe-arrow"><i class="fas fa-chevron-right"></i></span>
      <div class="step s3"><i class="fas fa-ban"></i><div class="step-title">배포 차단</div><div class="step-desc">미달 시 운영 반영 차단</div></div>
    </div>
    <div class="policy-strip">
      <div class="policy-item"><i class="fas fa-robot"></i>자동 검사</div>
      <div class="policy-item"><i class="fas fa-chart-line"></i>실시간 모니터링</div>
      <div class="policy-item"><i class="fas fa-clock-rotate-left"></i>기술 부채 추적</div>
    </div>
  </div>
  <div class="footer"><strong>핵심:</strong> 품질 기준 미달 시 운영 배포 원천 차단 — 장애 예방이 최선의 경영 전략</div>
</div>
<script>
(function(){
  function applyScale(){
    var el=document.querySelector('body>div');if(!el)return;
    var sw=window.innerWidth,sh=window.innerHeight,scale=Math.min(sw/960,sh/720);
    el.style.transform='scale('+scale+')';el.style.transformOrigin='top left';
    el.style.position='absolute';el.style.left=Math.round((sw-960*scale)/2)+'px';
    el.style.top=Math.round((sh-720*scale)/2)+'px';
  }
  applyScale();window.addEventListener('resize',applyScale);
})();
</script>
</body>
</html>
