<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<title>아키텍처 원칙 1 — 안정적 시작, 점진적 확장</title>
<script src="https://picture-search.skywork.ai/aippt/static/tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.2.0/css/all.min.css">
<link rel="stylesheet" href="/report-midclevel/slides/shared/slide-fonts.css">
<link rel="stylesheet" href="/report-midclevel/slides/shared/slide-motion.css">
<link rel="stylesheet" href="/report-midclevel/slides/shared/slide-theme-fluent-light.css">
<style>

* { box-sizing: border-box; margin: 0; padding: 0; }
body { width:100vw; height:100vh; overflow:hidden; background:var(--ppt-bg);
  display:flex; justify-content:center; align-items:center; font-family:var(--ppt-font-body); }
.fass-slide-root { width:960px; height:720px; background:var(--ppt-bg); color:var(--ppt-text-1);
  display:flex; flex-direction:column; overflow:hidden; }
.title-region-wrapper { padding:22px 40px 6px; display:flex; flex-direction:column; gap:6px; }
.title-region-header { display:flex; align-items:center; gap:12px; }
.title-region-bar { width:4px; height:32px; background:var(--ppt-accent); border-radius:2px; }
.title-region-text { font-family:var(--ppt-font-display); font-size:28px; font-weight:700; margin:0; }
.title-sub { font-size:14px; color:var(--ppt-text-2); padding-left:16px; line-height:1.4; }
.title-region-line { height:1px; width:100%; background:linear-gradient(90deg,var(--ppt-accent),transparent); opacity:0.3; margin-top:4px; }
.main-container { flex:1; min-height:0; padding:4px 40px 10px; display:flex; flex-direction:column; gap:8px; }
.columns { display:flex; gap:16px; flex:1; min-height:0; }
.left-col { flex:0 0 52%; display:flex; flex-direction:column; }
.visual-card { flex:1; background:var(--ppt-bg-soft); border:1px solid var(--ppt-border);
  border-radius:var(--ppt-radius-lg); padding:12px 14px; display:flex; flex-direction:column; gap:8px;
  box-shadow:var(--ppt-shadow-soft); }
.badge-cyan { background:rgba(0, 120, 212,0.1); color:var(--ppt-accent-light); padding:4px 12px;
  border-radius:var(--ppt-radius-sm); font-size:13px; font-weight:600; border:1px solid rgba(0, 120, 212,0.3);
  align-self:flex-start; }
.diagram { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
  background:var(--ppt-track-bg); border-radius:var(--ppt-radius-md); border:1px dashed var(--ppt-border); padding:12px; position:relative; }
.module-db-wrap { width:92%; position:relative; }
.conn-svg { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0; }
.server-box { width:100%; padding:14px; border:2px solid var(--ppt-accent); border-radius:var(--ppt-radius-md);
  background:rgba(0, 120, 212,0.05); display:flex; flex-direction:column; gap:10px; position:relative; z-index:1; }
.server-title { font-size:14px; color:var(--ppt-accent-light); font-weight:700; text-align:center; }
.module-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.module-box { background:var(--ppt-surface); border:1px solid var(--ppt-border); padding:10px 6px;
  border-radius:var(--ppt-radius-sm); text-align:center; display:flex; flex-direction:column; gap:4px; align-items:center; }
.module-box i { color:var(--ppt-accent-light); font-size:22px; }
.module-box span { font-size:13px; font-weight:600; }
.db-row { display:flex; justify-content:space-around; width:100%; margin-top:2px; }
.db-item { display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--ppt-text-3); font-size:12px; }
.diagram-caption { font-size:13px; color:var(--ppt-text-2); text-align:center; line-height:1.4; padding-top:4px; }
.right-col { flex:1; display:flex; flex-direction:column; gap:8px; justify-content:center; }
.compare-card { flex:1; background:var(--ppt-bg-soft); border:1px solid var(--ppt-border);
  border-radius:var(--ppt-radius-md); padding:12px 14px; display:flex; align-items:center; gap:12px; }
.compare-card.highlight { border:2px solid rgba(0, 120, 212,0.55); border-left:4px solid var(--ppt-accent);
  background:linear-gradient(135deg,rgba(0, 120, 212,0.14),var(--ppt-bg-soft));
  box-shadow:0 0 22px rgba(0, 120, 212,0.16); }
.compare-num { width:28px; height:28px; border-radius:50%; background:var(--ppt-surface);
  border:1px solid var(--ppt-border); font-size:13px; font-weight:700; color:var(--ppt-text-2);
  display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.compare-card.highlight .compare-num { background:rgba(0, 120, 212,0.22); border-color:var(--ppt-accent-light); color:var(--ppt-text-1); }
.compare-icon { width:44px; height:44px; border-radius:var(--ppt-radius-lg); background:var(--ppt-track-bg);
  display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0; }
.compare-card:nth-child(1) .compare-icon { color:var(--ppt-text-3); }
.compare-card.highlight .compare-icon { color:var(--ppt-accent-light); }
.compare-card:nth-child(3) .compare-icon { color:var(--ppt-purple); }
.compare-body { flex:1; min-width:0; }
.compare-title { font-size:15px; font-weight:700; margin-bottom:2px; }
.compare-card.highlight .compare-title { color:var(--ppt-accent-light); }
.compare-label { font-size:14px; font-weight:600; color:var(--ppt-text-1); margin-bottom:2px; }
.compare-desc { font-size:12.5px; color:var(--ppt-text-3); line-height:1.4; }
.fass-badge { font-size:11px; font-weight:700; padding:2px 7px; border-radius:10px;
  background:rgba(0, 120, 212,0.22); color:var(--ppt-text-1); border:1px solid rgba(0, 120, 212,0.55); margin-left:6px; }
.footer-box { background:linear-gradient(90deg,rgba(255, 185, 0,0.1),transparent);
  border-left:4px solid var(--ppt-accent-2); padding:9px 16px; border-radius:0 var(--ppt-radius-md) var(--ppt-radius-md) 0; flex-shrink:0; }
.footer-box p { font-size:14px; color:var(--ppt-text-1); line-height:1.4; }
html { overflow:hidden; margin:0; padding:0; }
</style>
</head>
<body>
<div class="fass-slide-root" data-motion="architecture" data-motion-tier="medium">
  <div class="title-region-wrapper">
    <div class="title-region-header">
      <div class="title-region-bar"></div>
      <h1 class="title-region-text">아키텍처 원칙 1 — 안정적 시작, 점진적 확장</h1>
    </div>
    <div class="title-sub">성급한 분산 전환 없이, 안정성과 확장성을 동시에 확보</div>
    <div class="title-region-line"></div>
  </div>
  <div class="main-container">
    <div class="columns">
      <div class="left-col">
        <div class="visual-card">
          <span class="badge-cyan">FaSS V3.0 — 모듈형 구조</span>
          <div class="diagram">
            <div class="module-db-wrap">
              <svg class="conn-svg" viewBox="0 0 400 120" preserveAspectRatio="none">
                <line x1="67" y1="70" x2="67" y2="95" stroke="var(--ppt-accent)" stroke-width="1" stroke-dasharray="4 3" opacity=".5"/>
                <line x1="200" y1="70" x2="200" y2="95" stroke="var(--ppt-accent)" stroke-width="1" stroke-dasharray="4 3" opacity=".5"/>
                <line x1="333" y1="70" x2="333" y2="95" stroke="var(--ppt-accent)" stroke-width="1" stroke-dasharray="4 3" opacity=".5"/>
              </svg>
            <div class="server-box">
              <div class="server-title">유통물류 시스템</div>
              <div class="module-grid">
                <div class="module-box"><i class="fa-solid fa-file-invoice"></i><span>수주</span></div>
                <div class="module-box"><i class="fa-solid fa-cart-shopping"></i><span>발주</span></div>
                <div class="module-box"><i class="fa-solid fa-calculator"></i><span>정산</span></div>
              </div>
            </div>
            <div class="db-row" style="position:relative;z-index:1">
              <div class="db-item"><i class="fas fa-database"></i><span>데이터 A</span></div>
              <div class="db-item" style="color:var(--ppt-accent)"><i class="fa-solid fa-shield"></i><span>격리</span></div>
              <div class="db-item"><i class="fas fa-database"></i><span>데이터 B</span></div>
              <div class="db-item" style="color:var(--ppt-accent)"><i class="fa-solid fa-shield"></i><span>격리</span></div>
              <div class="db-item"><i class="fas fa-database"></i><span>데이터 C</span></div>
            </div>
            <div class="diagram-caption">업무별 독립 모듈 · 데이터 격리로 안전한 운영</div>
            </div>
          </div>
        </div>
      </div>
      <div class="right-col">
        <div class="compare-card">
          <span class="compare-num">1</span>
          <div class="compare-icon"><i class="fas fa-cube"></i></div>
          <div class="compare-body">
            <div class="compare-title">일체형</div>
            <div class="compare-label">변경 어려움</div>
            <div class="compare-desc">전체 재배포 필요, 변경 리스크 큼</div>
          </div>
        </div>
        <div class="compare-card highlight">
          <span class="compare-num">2</span>
          <div class="compare-icon"><i class="fas fa-cubes"></i></div>
          <div class="compare-body">
            <div class="compare-title">모듈형 <span class="fass-badge">FaSS 선택</span></div>
            <div class="compare-label">안정 + 유연</div>
            <div class="compare-desc">핵심 업무 안정 + 신규 기능 빠른 추가</div>
          </div>
        </div>
        <div class="compare-card">
          <span class="compare-num">3</span>
          <div class="compare-icon"><i class="fas fa-network-wired"></i></div>
          <div class="compare-body">
            <div class="compare-title">분산형</div>
            <div class="compare-label">미래 확장</div>
            <div class="compare-desc">트래픽 증가 시 독립 확장 가능</div>
          </div>
        </div>
      </div>
    </div>
    <div class="footer-box">
      <p>핵심 업무는 안정적으로, 신규 기능은 빠르게 — 점진적 확장 전략</p>
    </div>
  </div>
</div>
<script>
(function(){
  function applyScale(){
    var el=document.querySelector('body>div'); if(!el)return;
    var sw=window.innerWidth,sh=window.innerHeight;
    var scale=Math.min(sw/960,sh/720);
    el.style.transform='scale('+scale+')'; el.style.transformOrigin='top left';
    el.style.position='absolute';
    el.style.left=Math.round((sw-960*scale)/2)+'px';
    el.style.top=Math.round((sh-720*scale)/2)+'px';
  }
  applyScale(); window.addEventListener('resize',applyScale);
})();
</script>
</body>
</html>
