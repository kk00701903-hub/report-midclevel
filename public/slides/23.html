<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<title>아키텍처 원칙 3 — 자동화된 배포</title>
<script src="https://picture-search.skywork.ai/aippt/static/tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.2.0/css/all.min.css">
<link rel="stylesheet" href="/report-midclevel/slides/shared/slide-fonts.css">
<link rel="stylesheet" href="/report-midclevel/slides/shared/slide-motion.css">
<link rel="stylesheet" href="/report-midclevel/slides/shared/slide-theme-fluent-dark.css">
<style>

*{box-sizing:border-box;margin:0;padding:0}
body{width:100vw;height:100vh;overflow:hidden;background:var(--ppt-bg);display:flex;justify-content:center;align-items:center;font-family:var(--ppt-font)}
.slide{width:960px;height:720px;background:var(--ppt-bg);color:var(--ppt-text-1);display:flex;flex-direction:column;overflow:hidden;position:relative}
.slide::before{content:'';position:absolute;inset:0;pointer-events:none;background:
  radial-gradient(ellipse at 20% 10%,rgba(0, 120, 212,.07) 0%,transparent 45%),
  radial-gradient(ellipse at 80% 90%,rgba(252,109,38,.06) 0%,transparent 40%)}
.title-wrap{flex-shrink:0;padding:22px 40px 6px;position:relative;z-index:1;display:flex;flex-direction:column;gap:6px}
.title-header{display:flex;align-items:center;gap:12px}
.title-bar{width:4px;height:32px;background:var(--ppt-accent);border-radius:2px}
.title-text{font-family:var(--ppt-font-display);font-size:28px;font-weight:700;margin:0}
.title-sub{font-size:14px;color:var(--ppt-text-2);padding-left:16px;line-height:1.4}
.title-line{height:1px;width:100%;background:linear-gradient(90deg,var(--ppt-accent),transparent);opacity:.3;margin-top:4px}
.body{flex:1;min-height:0;padding:10px 40px 8px;display:flex;flex-direction:column;gap:12px;position:relative;z-index:1;justify-content:center}
.pipeline{display:flex;align-items:stretch;gap:0;flex:1;min-height:0;max-height:340px}
.phase{flex:1;background:linear-gradient(160deg,rgba(30,38,56,.95),var(--ppt-bg-soft));border:1px solid var(--ppt-border);
  border-radius:16px;padding:16px 14px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:8px;position:relative;overflow:hidden}
.phase::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--ph);border-radius:16px 16px 0 0}
.phase::after{content:'';position:absolute;bottom:0;left:0;right:0;height:40%;background:linear-gradient(180deg,transparent,rgba(0,0,0,.15));pointer-events:none}
.phase-content{display:flex;flex-direction:column;align-items:center;gap:8px;z-index:1}
.phase-num{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid var(--ph);
  color:var(--ph);font-size:16px;font-weight:800;display:flex;align-items:center;justify-content:center}
.phase-icon{width:56px;height:56px;border-radius:16px;background:rgba(255,255,255,.06);
  display:flex;align-items:center;justify-content:center;font-size:28px;color:var(--ph);position:relative}
.phase-icon::before{content:'';position:absolute;inset:-6px;border-radius:20px;border:2px dashed var(--ph);opacity:.25}
.phase-title{font-size:18px;font-weight:700;text-align:center}
.phase-desc{font-size:13px;font-weight:600;color:var(--ppt-text-1);text-align:center;line-height:1.35}
.phase-detail{font-size:12px;color:var(--ppt-text-3);text-align:center;line-height:1.35}
.phase-bar{width:100%;display:flex;gap:4px;padding:0 8px;z-index:1}
.phase-bar span{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.1)}
.phase-bar span.on{background:var(--ph)}
.connector{display:flex;flex-direction:column;align-items:center;justify-content:center;width:52px;flex-shrink:0;position:relative}
.flow-track{width:100%;height:6px;background:var(--ppt-surface);border-radius:3px;border:1px solid var(--ppt-border);position:relative;overflow:hidden;margin:8px 0}
.flow-track::after{content:'';position:absolute;top:0;left:-40%;width:40%;height:100%;border-radius:3px;background:linear-gradient(90deg,transparent,var(--ppt-accent),transparent);animation:flow 3s linear infinite}
@keyframes flow{0%{left:-40%}100%{left:100%}}
.connector svg{width:20px;height:20px;color:var(--ppt-accent)}
.outcome-strip{display:flex;gap:10px;flex-shrink:0}
.outcome-item{flex:1;background:var(--ppt-bg-soft);border:1px solid var(--ppt-border);border-radius:10px;
  padding:12px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.outcome-item i{font-size:22px;color:var(--ppt-accent)}
.outcome-val{font-size:22px;font-weight:800;color:var(--ppt-accent-2);line-height:1}
.outcome-label{font-size:12px;font-weight:600;color:var(--ppt-text-2);line-height:1.35}
.footer{flex-shrink:0;margin:0 40px 12px;padding:9px 16px;font-size:14px;color:var(--ppt-text-2);
  border-left:3px solid var(--ppt-accent-2);background:rgba(255, 185, 0,.05);border-radius:0 8px 8px 0;line-height:1.45;position:relative;z-index:1}
.footer strong{color:var(--ppt-accent-2)}
html{overflow:hidden;margin:0;padding:0}
</style>
</head>
<body>
<div class="slide" data-motion="pipeline" data-motion-tier="medium">
  <div class="title-wrap">
    <div class="title-header">
      <div class="title-bar"></div>
      <h1 class="title-text">아키텍처 원칙 3 — 자동화된 배포</h1>
    </div>
    <div class="title-sub">코드 변경부터 서비스 반영까지 전 과정 자동화</div>
    <div class="title-line"></div>
  </div>

  <div class="body">
    <div class="pipeline">
      <div class="phase" style="--ph:var(--ppt-accent-2)">
        <div class="phase-content">
          <div class="phase-num">1</div>
          <div class="phase-icon"><i class="fas fa-code"></i></div>
          <div class="phase-title">코드 작성</div>
          <div class="phase-desc">변경 사항 등록</div>
          <div class="phase-detail">변경 이력 추적 · 협업 기반 개발</div>
        </div>
        <div class="phase-bar"><span class="on"></span><span></span><span></span></div>
      </div>

      <div class="connector">
        <div class="flow-track"></div>
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6z"/></svg>
      </div>

      <div class="phase" style="--ph:var(--ppt-accent)">
        <div class="phase-content">
          <div class="phase-num">2</div>
          <div class="phase-icon"><i class="fas fa-magnifying-glass"></i></div>
          <div class="phase-title">자동 검증</div>
          <div class="phase-desc">품질·보안 검사</div>
          <div class="phase-detail">품질·보안 기준 미달 시 자동 차단</div>
        </div>
        <div class="phase-bar"><span class="on"></span><span class="on"></span><span></span></div>
      </div>

      <div class="connector">
        <div class="flow-track"></div>
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6z"/></svg>
      </div>

      <div class="phase" style="--ph:var(--ppt-good)">
        <div class="phase-content">
          <div class="phase-num">3</div>
          <div class="phase-icon"><i class="fas fa-rocket"></i></div>
          <div class="phase-title">자동 배포</div>
          <div class="phase-desc">무중단 서비스 반영</div>
          <div class="phase-detail">승인된 변경만 운영 환경 반영</div>
        </div>
        <div class="phase-bar"><span class="on"></span><span class="on"></span><span class="on"></span></div>
      </div>
    </div>

    <div class="outcome-strip">
      <div class="outcome-item"><i class="fas fa-clock"></i><div class="outcome-val">90%↓</div><div class="outcome-label">배포 시간 단축</div></div>
      <div class="outcome-item"><i class="fas fa-user-shield"></i><div class="outcome-val">Zero</div><div class="outcome-label">휴먼 에러 감소</div></div>
      <div class="outcome-item"><i class="fas fa-clipboard-check"></i><div class="outcome-val">100%</div><div class="outcome-label">감사 추적</div></div>
    </div>
  </div>

  <div class="footer">
    <strong>핵심:</strong> 사람 개입 없이 품질 통과 후 배포 — 변경 이력·감사 추적으로 경영 투명성 확보
  </div>
</div>
<script>
(function(){
  function applyScale(){
    var el=document.querySelector('body>div');if(!el)return;
    var sw=window.innerWidth,sh=window.innerHeight;
    var scale=Math.min(sw/960,sh/720);
    el.style.transform='scale('+scale+')';el.style.transformOrigin='top left';
    el.style.position='absolute';
    el.style.left=Math.round((sw-960*scale)/2)+'px';
    el.style.top=Math.round((sh-720*scale)/2)+'px';
  }
  applyScale();window.addEventListener('resize',applyScale);
})();
</script>
</body>
</html>
